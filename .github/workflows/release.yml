name: Release

# Runs when a commit that changes "version" in src-tauri/tauri.conf.json lands on main (the release PR from
# scripts/release.mjs): if no vX.Y.Z tag exists yet, it publishes that release and tauri-action creates the tag.
# Pushing a vX.Y.Z tag by hand still works too.
# tauri-action builds Windows and macOS, signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY
# and uploads latest.json, which the installed apps read to update themselves.
# The android job builds the signed APK and attaches it to the same release.

on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # On main, release only when the version in tauri.conf.json has no tag yet,
  # and never with failing tests or type errors.
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      # 22+: pdf.js uses Map.groupBy, which Node 20 lacks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests, types and lint
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run lint
          npm test
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macos-14 is rejected for this account and macos-13 never gets a runner: keep macos-15.
          - platform: macos-15
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Reuses compiled Rust dependencies between builds (the bulk of the build time).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Waraq v__VERSION__"
          releaseBody: "See the changes below. Installed copies of Waraq update themselves from this release."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Signed release APK, attached to the same release once tauri-action has created it.
  # Needs the repo secrets ANDROID_KEYSTORE_BASE64 (the keystore file, base64), ANDROID_KEYSTORE_PASSWORD and
  # ANDROID_KEY_PASSWORD; build.gradle.kts signs only when keystore.properties exists, written here from them.
  android:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          # Keep Gradle's downloads between runs: Maven Central rate-limits (429) runners that fetch everything.
          cache: gradle
          cache-dependency-path: |
            src-tauri/gen/android/**/*.gradle*
            src-tauri/gen/android/**/gradle-wrapper.properties

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waraq-release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/waraq-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=waraq"
            echo "keyPassword=$KEY_PASSWORD"
          } > src-tauri/gen/android/app/keystore.properties
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # 64-bit and older 32-bit ARM phones in one universal APK.
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Attach to the release
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          apk="Waraq_${version}_android.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          # The desktop jobs create the release; wait for it (up to 40 minutes).
          for i in $(seq 1 80); do
            gh release view "v$version" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "v$version" "$apk" --clobber
