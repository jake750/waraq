name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to publish a release.
# tauri-action builds Windows and macOS, signs the updater bundles with TAURI_SIGNING_PRIVATE_KEY
# and uploads latest.json, which the installed apps read to update themselves.
# The Android APK is still built locally and attached to the same release by hand (Waraq.apk).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # macos-14 is rejected for this account and macos-13 never gets a runner: keep macos-15.
          - platform: macos-15
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Reuses compiled Rust dependencies between builds (the bulk of the build time).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Waraq v__VERSION__"
          releaseBody: "See the changes below. Installed copies of Waraq update themselves from this release."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
