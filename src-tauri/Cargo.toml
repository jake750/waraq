[package]
name = "waraq"
version = "0.1.0"
description = "Offline document converter, PDF reader and editor"
authors = ["jake750"]
license = "MIT"
edition = "2024"

[lib]
# The _lib suffix avoids a name clash between the library and the binary on Windows
name = "waraq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

[dev-dependencies]
tempfile = "3"
